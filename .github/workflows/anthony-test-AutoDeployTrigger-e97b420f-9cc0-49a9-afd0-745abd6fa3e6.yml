name: Trigger auto deployment for anthony-test

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ buildpacks ]
    paths:
    - '**'
    - '.github/workflows/anthony-test-AutoDeployTrigger-e97b420f-9cc0-49a9-afd0-745abd6fa3e6.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.ANTHONYTEST_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ANTHONYTEST_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ANTHONYTEST_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: 
          registryUsername: ${{ secrets.ANTHONYTEST_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ANTHONYTEST_REGISTRY_PASSWORD }}
          containerAppName: anthony-test
          resourceGroup: anthony-resource-group
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


